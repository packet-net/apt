name: Build apt repo

on:
  # Source repos POST a release-published repository_dispatch at the end of their release
  # workflow, so a tag reaches apt in about a minute. repository_dispatch only ever runs the
  # copy of this workflow that is on the default branch, which is where this file lives.
  repository_dispatch:
    types: [release-published]
  # The self-heal path for a dispatch that never arrived (a missing or expired token in the
  # source repo, a failed POST). Daily is plenty now that it is not the primary trigger.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

# Every run rebuilds the whole index and force-pushes gh-pages, so two of them at once is a
# race: the loser dies on `cannot lock ref 'refs/heads/gh-pages': is at X but expected Y`
# after having done all the work. That is not hypothetical - it happened on 2026-09-21 when
# a push to main and a source repo's release dispatch landed seconds apart, and again the
# same evening with three runs in flight. It gets likelier as more projects adopt the repo,
# because every one of them dispatches here the moment it tags.
#
# cancel-in-progress: false, not true. Cancelling the in-flight run in favour of a newer one
# looks right - a later run indexes a superset of what the earlier one would have - but a run
# cancelled DURING its push can leave gh-pages half-updated, with a Packages index that does
# not match the pool beside it. Queue them instead: a build is a couple of minutes, and the
# newer one simply runs next and re-indexes everything anyway.
concurrency:
  group: build-apt-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev gnupg

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build repository index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-repo.sh "$KEYID"

      - name: Publish to gh-pages
        run: |
          cd public
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rebuild apt repo index $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
